# =================================================
# Image 設定
# pod 啟動時都重新 pull Image, 確定拿到latest Image
# =================================================
image:
  repository: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.ap-southeast-1.amazonaws.com/sre-demo-nginx 
  tag: latest
  pullPolicy: Always

# ================================================
# 確保基本高可用性
# ================================================
replicaCount: 2 

# ================================================
# 在AWS 上直接建立NLB
# ================================================
service:
  type: LoadBalancer 
  port: 80           
  targetPort: 8080

# ===============================================
# 確保Pod 都有拿到 Resource 同時不要超過限制
# ===============================================
resources: 
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ===============================================
# 利用CPU 使用率自動調整 replica 數量
# ===============================================
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

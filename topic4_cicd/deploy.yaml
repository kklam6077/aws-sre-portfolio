name: Sre-Demo SRE Pretest CI/CD Pipeline

# Trigger: 當 PR 被 merge 進 main branch 時執行
# 確保只有真正 merge 的 PR 才觸發，rejected/closed PR 不會觸發
on:
  pull_request:
    branches:
      - main
    types:
      - closed

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: sre-demo-nginx
  EKS_CLUSTER_NAME: sre-demo-cluster
  HELM_RELEASE_NAME: sre-demo-web
  TF_WORKING_DIR: ./topic1_terraform

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Terraform
  # 與應用程式部署分開成獨立 job
  # ────────────────────────────────────────────────────────────
  terraform:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: AWS authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      # Step 4: Terraform Init
      # 使用 Partial Configuration 注入 S3 backend 設定
      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=sre-pretest/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      # Step 5: Terraform Plan
      # 將結果顯示在 GitHub Actions log 人工確認
      # 將 plan 結果存檔，確保後續 apply 執行的是同一份 plan
      - name: Terraform plan
        run: |
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="cluster_name=${{ env.EKS_CLUSTER_NAME }}" \
            -var="vpc_cidr=${{ secrets.TF_VPC_CIDR }}" \
            -out=tfplan

      # Step 6: Terraform Apply
      # 套用 plan 結果，自動確認不需人工輸入
      # 只 apply 先前 plan 產生的 tfplan，不會有額外的變更
      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  # ────────────────────────────────────────────────────────────
  # Job 2: Build and Deploy Application
  # 負責 Docker image build、推送 ECR、Helm 部署
  # ────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build and Deploy Application
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      # Step 1: Checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: AWS authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: ECR login
      # 取得 ECR 的臨時 Docker login token
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Generate image tag from Git commit SHA
      # 使用 Git short SHA 作為 image tag，而非 latest，出問題時可快速 rollback
      - name: Get Git short SHA
        id: vars
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Step 5: Build and push Docker image
      # build 之後 用SHA tag 推送至 ECR
      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          cd topic2_docker
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Step 6: Install tools and configure kubectl
      # 安裝 Helm 並透過 aws cli 更新 kubeconfig，
      - name: Setup Helm and configure kubectl
        run: |
          sudo snap install helm --classic
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      # Step 7: Deploy to EKS via Helm
      # --set image.tag 將 SHA 注入 values，K8s 偵測到 tag 變更後觸發 rolling update
      - name: Deploy to EKS via Helm
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./topic3_helm_kubernetes/sre-demo-app \
            --set image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG

      # Step 8: Verify deployment
      # 等待 rolling update 完成，確認所有 pod 都成功啟動
      # 若 pod 起不來（image pull error、crashloop），pipeline 標記為 failed
      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE_NAME }} \
            --timeout=120s
